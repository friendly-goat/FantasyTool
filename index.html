<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#131a2b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FantasyTool" />
    <title>FantasyTool</title>
    <script>
      // Apply the saved theme before the first paint to avoid a flash.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem("fantasytool.theme");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = theme;
        // The phone's status bar and browser chrome match the page (theme.ts keeps it in step).
        document.querySelector('meta[name="theme-color"]').content = theme === "light" ? "#eef1f6" : "#131a2b";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
