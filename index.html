<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#131a2b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fantasy Tool" />
    <title>Fantasy Tool</title>
    <style>
      /* The page's own colors from the very first moment, before the app's styles load. */
      html { background: #131a2b; color: #f2f5fa; }
      html[data-theme="light"] { background: #eef1f6; color: #131a2b; }
      .boot { min-height: 100vh; display: grid; place-items: center; font: 600 1.25rem/1.2 system-ui, sans-serif; opacity: 0.6; }
    </style>
    <script>
      // Apply the saved theme before the first paint to avoid a flash.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem("fantasytool.theme");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = theme;
        // The phone's status bar and browser chrome match the page (theme.ts keeps it in step).
        document.querySelector('meta[name="theme-color"]').content = theme === "light" ? "#eef1f6" : "#131a2b";
      })();
    </script>
  </head>
  <body>
    <!-- Shown until the app starts (React replaces it). -->
    <div id="root"><div class="boot">Fantasy Tool</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
